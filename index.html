<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Media Converter — local, privado, rápido</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo.
      (() => {
        const t = localStorage.getItem('theme');
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <main class="mx-auto w-full max-w-2xl px-4 py-8 sm:px-6 sm:py-14">

      <!-- Header -->
      <header class="flex items-center justify-between gap-4 mb-10">
        <div class="flex items-center gap-3 min-w-0">
          <img src="/icon.svg" alt="" class="w-9 h-9 rounded-xl flex-shrink-0" />
          <div class="min-w-0">
            <h1 class="text-lg font-semibold tracking-tight truncate">Media Converter</h1>
            <p class="text-xs text-muted">Local, privado y rápido</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <button id="btn-theme" class="btn-icon" title="Cambiar tema" aria-label="Cambiar tema">
            <span data-icon="sun" data-icon-dark="moon"></span>
          </button>
          <button id="btn-clear-cache" class="btn-ghost btn text-xs" title="Borra el motor FFmpeg descargado">
            <span data-icon="trash"></span>
            <span class="hidden sm:inline">Limpiar caché</span>
            <span id="cache-size" class="text-muted"></span>
          </button>
        </div>
      </header>

      <!-- Gate de instalación -->
      <section id="install-gate" class="hidden surface p-8 text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl mb-5" style="background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent);">
          <span data-icon="install" data-icon-cls="icon-lg"></span>
        </div>
        <h2 class="text-base font-semibold mb-2">Instalar el motor de conversión</h2>
        <p class="text-sm text-muted mb-1">Usa <strong class="text-accent">FFmpeg.wasm</strong>, que corre 100% en tu navegador.</p>
        <p class="text-sm text-muted mb-6">Se descarga una sola vez (<strong id="install-size">≈ 32 MB</strong>) y queda en caché.</p>

        <div id="install-progress" class="hidden mb-6 text-left">
          <div class="flex justify-between text-xs text-muted mb-1.5">
            <span id="install-progress-text">Descargando…</span>
            <span id="install-progress-pct">0%</span>
          </div>
          <div class="track h-1.5"><div id="install-progress-bar" class="bar" style="width:0%"></div></div>
        </div>

        <button id="btn-install" class="btn btn-primary">
          <span data-icon="download"></span> Descargar e instalar
        </button>
      </section>

      <!-- App -->
      <section id="app" class="hidden">

        <!-- Modos -->
        <div class="seg mb-4" role="tablist">
          <button data-mode="compress" class="seg-item" role="tab"><span data-icon="shrink"></span> Comprimir</button>
          <button data-mode="convert" class="seg-item" role="tab"><span data-icon="repeat"></span> Convertir</button>
          <button data-mode="extract" class="seg-item" role="tab"><span data-icon="audio"></span> Extraer audio</button>
        </div>
        <p id="mode-desc" class="text-sm text-muted mb-6"></p>

        <!-- Drop zone -->
        <label id="drop-zone" class="dropzone flex flex-col items-center justify-center text-center p-8 sm:p-10">
          <span data-icon="upload" data-icon-cls="icon-lg" class="text-muted mb-3"></span>
          <p class="text-sm font-medium">Arrastrá tus archivos o hacé clic</p>
          <p class="text-xs text-muted mt-1">Podés seleccionar varios a la vez</p>
          <input type="file" id="file-input" class="hidden" multiple />
        </label>

        <!-- Opciones -->
        <div id="options" class="hidden mt-6 surface p-4 sm:p-5 space-y-5">

          <!-- COMPRIMIR -->
          <div data-panel="compress" class="mode-panel hidden space-y-4">
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="compress-method" value="quality" class="peer sr-only" checked>
                <div class="btn btn-ghost w-full peer-checked:!border-[var(--accent)] peer-checked:text-accent">Por calidad</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="compress-method" value="targetsize" class="peer sr-only">
                <div class="btn btn-ghost w-full peer-checked:!border-[var(--accent)] peer-checked:text-accent">Tamaño objetivo</div>
              </label>
            </div>

            <div id="compress-quality-wrap" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="label">Calidad</label>
                <select id="compress-quality" class="input">
                  <option value="high">Alta (poca pérdida)</option>
                  <option value="medium" selected>Media (recomendado)</option>
                  <option value="low">Baja (máximo ahorro)</option>
                </select>
              </div>
              <div>
                <label class="label">Reducir resolución</label>
                <select id="compress-resolution" class="input">
                  <option value="">Mantener original</option>
                  <option value="1080">1080p</option>
                  <option value="720">720p</option>
                  <option value="480">480p</option>
                </select>
              </div>
            </div>

            <div id="compress-target-wrap" class="hidden">
              <label class="label">Tamaño objetivo (MB)</label>
              <input type="number" id="compress-target" min="1" step="1" placeholder="Ej: 10" class="input">
              <p class="text-xs text-muted mt-1">Se calcula el bitrate para acercarse a ese peso.</p>
            </div>
          </div>

          <!-- CONVERTIR -->
          <div data-panel="convert" class="mode-panel hidden space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="label">Formato de salida</label>
                <select id="convert-format" class="input">
                  <optgroup label="Video">
                    <option value="mp4">MP4</option>
                    <option value="webm">WebM</option>
                    <option value="mkv">MKV</option>
                    <option value="avi">AVI</option>
                  </optgroup>
                  <optgroup label="Audio">
                    <option value="mp3">MP3</option>
                    <option value="wav">WAV</option>
                    <option value="aac">AAC</option>
                    <option value="ogg">OGG</option>
                  </optgroup>
                </select>
              </div>
              <div id="convert-quality-wrap">
                <label class="label">Calidad (si re-encodea)</label>
                <select id="convert-quality" class="input">
                  <option value="high">Alta</option>
                  <option value="medium" selected>Media</option>
                  <option value="low">Baja</option>
                </select>
              </div>
            </div>
            <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
              <input type="checkbox" id="convert-lossless" checked class="accent-[var(--accent)] w-4 h-4">
              Sin pérdida si es posible <span class="text-muted">(copia sin recodificar)</span>
            </label>
          </div>

          <!-- EXTRAER AUDIO -->
          <div data-panel="extract" class="mode-panel hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="label">Formato de audio</label>
              <select id="extract-format" class="input">
                <option value="mp3">MP3</option>
                <option value="aac">AAC</option>
                <option value="ogg">OGG</option>
                <option value="wav">WAV</option>
              </select>
            </div>
            <div>
              <label class="label">Bitrate</label>
              <select id="extract-bitrate" class="input">
                <option value="320">320 kbps (alta)</option>
                <option value="192" selected>192 kbps</option>
                <option value="96">96 kbps</option>
              </select>
            </div>
          </div>

          <!-- Concurrencia -->
          <div id="concurrency-wrap" class="hidden divider pt-4">
            <label class="label">Archivos en paralelo</label>
            <select id="concurrency" class="input sm:max-w-xs">
              <option value="1" selected>1 (secuencial)</option>
              <option value="2">2 (más rápido, más RAM)</option>
              <option value="3">3 (máximo uso de RAM)</option>
            </select>
          </div>

          <button id="btn-convert" class="btn btn-primary w-full">
            <span data-icon="repeat"></span> Convertir
          </button>
        </div>

        <!-- Lista de archivos -->
        <div id="file-list" class="mt-4 space-y-2.5"></div>
      </section>

      <footer class="text-center text-xs text-muted mt-12">
        Tus archivos nunca salen de tu dispositivo.
      </footer>
    </main>

    <!-- Toasts -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm"></div>

    <!-- Habilita cross-origin isolation en hosts sin headers COOP/COEP (GitHub Pages) -->
    <script src="/coi-serviceworker.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
